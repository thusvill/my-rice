# Noir Kitty configuration
shell /usr/bin/fish
term xterm-kitty
font_family JetBrains Mono
font_size 10.5
disable_ligatures never
# Let Neovim fill the Kitty content area completely.
window_padding_width 0
hide_window_decorations yes
confirm_os_window_close 0
scrollback_lines 10000
enable_audio_bell no
cursor_shape block
cursor_blink_interval 0
mouse_hide_wait 2

foreground #d0d0d0
background #000000
selection_foreground #ffffff
selection_background #2a2a2a

color0 #000000
color1 #777777
color2 #999999
color3 #aaaaaa
color4 #888888
color5 #bbbbbb
color6 #cccccc
color7 #d0d0d0
color8 #303030
color9 #999999
color10 #aaaaaa
color11 #bbbbbb
color12 #aaaaaa
color13 #cccccc
color14 #dddddd
color15 #ffffff
